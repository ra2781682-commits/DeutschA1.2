<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabular German → Român</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2340;--mut:#6b7394;--pr:#4f46e5;--pr2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--bd:#e3e7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#1a1e3a;--tx:#eef0ff;--mut:#9aa2c8;--bd:#2b3060}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#1a1e3a;--tx:#eef0ff;--mut:#9aa2c8;--bd:#2b3060}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:22px 16px 18px;text-align:center}
header h1{margin:0;font-size:clamp(22px,5vw,32px)}header p{margin:4px 0 12px;opacity:.9}
.bar{max-width:520px;margin:auto;height:12px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fde68a;transition:width .4s}
#pt{font-size:14px;margin-top:6px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px;max-width:900px;margin:auto}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;border-radius:24px;font:700 15px Nunito,sans-serif;cursor:pointer}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:12px}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input{font:600 15px Nunito,sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.btn{border:0;border-radius:14px;padding:12px 20px;font:800 15px Nunito,sans-serif;cursor:pointer;background:var(--pr);color:#fff}
.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(40,40,110,.08);text-align:center}
.fc{perspective:900px;height:230px;cursor:pointer;margin:6px 0 16px}
.fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(26px,7vw,40px);font-weight:800;padding:12px}
.fs.a{background:linear-gradient(135deg,#eef2ff,#e0e7ff);color:#312e81}
.fs.b{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;transform:rotateY(180deg)}
.fs small{font-size:14px;font-weight:600;opacity:.7;margin-top:8px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.q{font-size:clamp(24px,6vw,34px);font-weight:800;margin:6px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:16px 8px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:700 16px Nunito,sans-serif;cursor:pointer}
.opts button.ok,.tile.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:18px 6px;min-height:70px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:700 15px Nunito,sans-serif;cursor:pointer}
.tile.sel{border-color:var(--pr);background:#eef2ff;color:#312e81}.tile.ok{opacity:.55;pointer-events:none}
.tile.no{background:var(--bad);color:#fff}
.sc{color:var(--mut);font-weight:700;margin-bottom:8px}
.fb{min-height:26px;font-weight:800;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
td{padding:10px 12px;border-bottom:1px solid var(--bd)}td:last-child{color:var(--pr);font-weight:700}
.sp{cursor:pointer;background:none;border:0;font-size:18px}
#win{position:fixed;inset:0;background:rgba(15,18,38,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#win .panel{max-width:460px;padding:34px 24px}
#win h2{font-size:clamp(34px,9vw,52px);margin:8px 0;color:var(--pr)}
.heart{font-size:64px;animation:bt 1s infinite}@keyframes bt{50%{transform:scale(1.2)}}
footer{text-align:center;color:var(--mut);padding:20px;font-size:13px}
.w{overflow-x:auto}
</style></head><body>
<header><h1>🇩🇪 → 🇷🇴 Vocabular German</h1><p>Învață cuvintele noi, jucându-te</p>
<div class="bar"><i id="pb"></i></div><div id="pt"></div></header>
<nav id="nav"></nav>
<main>
<div class="tool"><select id="cat"></select><button class="btn l" id="th">🌓 Temă</button><button class="btn l" id="rs">↺ Resetează progresul</button></div>
<div id="v"></div></main>
<div id="win"><div class="panel"><div class="heart">❤️</div><p style="font-size:20px;font-weight:800;margin:0">Draga mea <input id="nm" placeholder="…………" style="width:130px;text-align:center"></p><h2>Te iubesc!</h2><p style="color:var(--mut)">Ai învățat toate cuvintele. Felicitări! 🎉</p><button class="btn" onclick="win.style.display='none'">Continuă</button></div></div>
<footer>Făcut cu drag ❤️</footer>
<script>
const RAW={
"Școală și lucruri":"das Buch=cartea;das Heft=caietul;der Kugelschreiber=pixul;der Bleistift=creionul;der Marker=markerul;der Radiergummi=guma de șters;die Tasche=geanta;das Taschentuch=batista;das Handy=telefonul mobil;die Brille=ochelarii;die Flasche=sticla;die Tasse=cana;der Schlüssel=cheia;der Tisch=masa",
"Verbe de curs":"lesen=a citi;hören=a auzi;schreiben=a scrie;verbinden=a lega;zuordnen=a asocia;ergänzen=a completa;markieren=a marca;ankreuzen=a bifa;lernen=a învăța;fragen=a întreba;wiederholen=a repeta;antworten=a răspunde;auf Deutsch=în germană",
"Cuvinte utile":"können=a putea;man=se (impersonal);noch einmal=încă o dată;bitte=te rog;so=așa;Was?=Ce?;falsch=greșit;ein/eine=un/o;kein/keine=niciun/nicio;hier=aici;von=de la;auch=și, de asemenea;aber=dar;für=pentru;mit=cu;nicht=nu;noch=încă;alles=totul;schön=frumos;okay=în regulă;gerne=cu plăcere",
"Casa și camerele":"das Haus=casa;die Wohnung=apartamentul;das Zimmer=camera;das Wohnzimmer=sufrageria;der Flur=holul;die Küche=bucătăria;das Bad=baia;die Toilette=toaleta;der Balkon=balconul;der Stock=etajul;im ersten Stock=la etajul întâi;das Erdgeschoss=parterul;der Garten=grădina;die Treppe=scara;der Hof=curtea;der Müll=gunoiul;die Hausordnung=regulamentul casei",
"Oameni și chirie":"der Vermieter=proprietarul;die Vermieterin=proprietăreasa;die Miete=chiria;der Nachbar=vecinul;die Nachbarin=vecina;der Paketbote=curierul;das Paket=coletul;der Brief=scrisoarea;der Gruß=salutul;die Party=petrecerea;suchen=a căuta;kosten=a costa;Wie viel?=Cât?;Wie viele?=Câți?",
"Adjective":"gut=bun;nett=drăguț;groß=mare;klein=mic;dunkel=întunecat;hell=luminos;ruhig=liniștit;laut=zgomotos;alt=vechi;neu=nou;billig=ieftin;teuer=scump;hoch=înalt;leise=încet;schmal=îngust;lang=lung;kurz=scurt;breit=lat;dick=gros;dünn=subțire;hässlich=urât;schlank=zvelt",
"Regulile casei":"feiern=a sărbători;bekommen=a primi;beachten=a respecta;informieren=a informa;telefonieren=a telefona;verstehen=a înțelege;gehen=a merge;müssen=a trebui;dürfen=a avea voie;grillen=a face grătar;lüften=a aerisi;rauchen=a fuma;putzen=a curăța;spielen=a se juca",
"Fructe și legume":"der Apfel=mărul;die Banane=banana;die Orange=portocala;die Melone=pepenele;der Blumenkohl=conopida;die Tomate=roșia;die Paprika=ardeiul;die Zwiebel=ceapa;die Bohne=fasolea;der Salat=salata;die Avocado=avocado;die Kartoffel=cartoful;die Aubergine=vinetele;das Gemüse=legumele",
"Mâncare și băuturi":"das Brot=pâinea;das Ei=oul;das Öl=uleiul;die Butter=untul;das Salz=sarea;der Pfeffer=piperul;der Saft=sucul;der Tee=ceaiul;der Kaffee=cafeaua;die Pizza=pizza;die Suppe=supa;die Milch=laptele;der Zucker=zahărul;das Mehl=făina;das Wasser=apa;das Mineralwasser=apa minerală;der Fisch=peștele;das Fleisch=carnea;die Nudel=tăițeii;der Reis=orezul;der Käse=brânza;das Abendessen=cina",
"La piață":"der Markt=piața;das Restaurant=restaurantul;kaufen=a cumpăra;bezahlen=a plăti;kochen=a găti;essen=a mânca;trinken=a bea;brauchen=a avea nevoie;möchten=a dori;nehmen=a lua;Ich hätte gerne …=Aș dori …;das Kilogramm=kilogramul;das Gramm=gramul;der Liter=litrul;die Dose=conserva;die Packung=pachetul;der Cent=centul"};
const W=[];for(const c in RAW)RAW[c].split(";").forEach(s=>{const[g,r]=s.split("=");W.push({g,r,c,id:g})});
const art=w=>(w.g.match(/^(der|die|das) /)||[])[1];
const $=id=>document.getElementById(id),V=$("v");
let known=new Set(),mode="cards",cat="*";
try{known=new Set(JSON.parse(localStorage.getItem("kn")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("kn",JSON.stringify([...known]))}catch(e){}};
const pool=()=>W.filter(w=>cat=="*"||w.c==cat);
const sh=a=>[...a].sort(()=>Math.random()-.5);
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function prog(){const p=Math.round(known.size/W.length*100);$("pb").style.width=p+"%";$("pt").textContent=`${known.size} / ${W.length} cuvinte învățate (${p}%)`;
 if(known.size==W.length)$("win").style.display="flex"}
const M={cards:"🃏 Cărți",quiz:"❓ Test",match:"🧩 Potrivire",type:"✍️ Scrie",art:"🎯 Articole",list:"📖 Listă"};
$("nav").innerHTML=Object.keys(M).map(k=>`<button data-k="${k}">${M[k]}</button>`).join("");
$("nav").onclick=e=>{if(e.target.dataset.k){mode=e.target.dataset.k;go()}};
$("cat").innerHTML='<option value="*">Toate categoriile ('+W.length+')</option>'+Object.keys(RAW).map(c=>`<option>${c}</option>`).join("");
$("cat").onchange=e=>{cat=e.target.value;go()};
$("th").onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0f1226";d.dataset.theme=dk?"light":"dark"};
$("rs").onclick=()=>{if(confirm("Ștergi tot progresul?")){known.clear();save();go()}};
function go(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k==mode));prog();({cards,quiz,match,type,art:artG,list})[mode]()}
/* Cărți */
function cards(){let L=sh(pool().filter(w=>!known.has(w.id)));if(!L.length)L=sh(pool());let i=0;
 const show=()=>{const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">Cardul ${i+1} din ${L.length} · atinge cardul pentru a-l întoarce</div>
 <div class="fc" id="fc"><div class="fi"><div class="fs a">${w.g}<small>🔊 atinge pentru română</small></div><div class="fs b">${w.r}<small>${w.c}</small></div></div></div>
 <div class="row"><button class="btn l" id="pv">◀</button><button class="btn r" id="st">Încă învăț</button><button class="btn g" id="kn">Știu ✓</button><button class="btn l" id="nx">▶</button></div></div>`;
 $("fc").onclick=()=>{$("fc").classList.toggle("f");say(w.g)};
 $("pv").onclick=()=>{i=(i+L.length-1)%L.length;show()};$("nx").onclick=()=>{i=(i+1)%L.length;show()};
 $("st").onclick=()=>{known.delete(w.id);save();prog();i=(i+1)%L.length;show()};
 $("kn").onclick=()=>{known.add(w.id);save();prog();i=(i+1)%L.length;show()}};show()}
/* Test */
function quiz(){let L=sh(pool()),i=0,s=0;
 const show=()=>{if(i>=L.length){V.innerHTML=`<div class="panel"><h2>Rezultat: ${s} / ${L.length}</h2><button class="btn" onclick="go()">Din nou</button></div>`;return}
 const w=L[i],o=sh([w,...sh(W.filter(x=>x!=w)).slice(0,3)]);
 V.innerHTML=`<div class="panel"><div class="sc">Întrebarea ${i+1}/${L.length} · Scor ${s}</div><div class="q">${w.g}</div><div class="opts">${o.map(x=>`<button>${x.r}</button>`).join("")}</div></div>`;
 V.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{const ok=b.textContent==w.r;b.classList.add(ok?"ok":"no");if(ok){s++;known.add(w.id);save();prog()}else V.querySelectorAll(".opts button").forEach(x=>{if(x.textContent==w.r)x.classList.add("ok")});
 V.querySelectorAll(".opts button").forEach(x=>x.disabled=true);setTimeout(()=>{i++;show()},900)})};show()}
/* Potrivire */
function match(){const L=sh(pool()).slice(0,6);let t=sh(L.flatMap(w=>[{k:w.id,t:w.g},{k:w.id,t:w.r}])),sel=null,done=0;
 V.innerHTML=`<div class="panel"><div class="sc">Potrivește cuvântul german cu traducerea</div><div class="grid">${t.map((x,i)=>`<button class="tile" data-i="${i}">${x.t}</button>`).join("")}</div><div class="fb" id="fb"></div><button class="btn" style="margin-top:12px" onclick="match()">Joc nou</button></div>`;
 V.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(!sel){sel=b;b.classList.add("sel");return}if(sel==b)return;
  const a=t[sel.dataset.i],c=t[b.dataset.i];
  if(a.k==c.k){sel.className=b.className="tile ok";known.add(a.k);save();prog();if(++done==L.length)$("fb").textContent="🎉 Bravo!"}
  else{const s=sel;s.classList.replace("sel","no");b.classList.add("no");setTimeout(()=>{s.className=b.className="tile"},500)}sel=null})}
/* Scrie */
function type(){let L=sh(pool()),i=0;
 const show=()=>{if(i>=L.length)i=0;const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">Scrie cuvântul în germană</div><div class="q">${w.r}</div><input id="in" style="width:100%;max-width:340px;text-align:center" autocomplete="off" placeholder="…"><div class="fb" id="fb"></div><div class="row"><button class="btn" id="ck">Verifică</button><button class="btn l" id="sk">Sări</button></div></div>`;
 const n=s=>s.toLowerCase().replace(/^(der|die|das) /,"").trim();
 const chk=()=>{if(n($("in").value)==n(w.g)){$("fb").style.color="var(--ok)";$("fb").textContent="✓ Corect: "+w.g;known.add(w.id);save();prog();i++;setTimeout(show,1000)}else{$("fb").style.color="var(--bad)";$("fb").textContent="✗ Mai încearcă"}};
 $("ck").onclick=chk;$("in").onkeydown=e=>{if(e.key=="Enter")chk()};$("sk").onclick=()=>{$("fb").textContent="Răspuns: "+w.g;i++;setTimeout(show,1400)};$("in").focus()};show()}
/* Articole */
function artG(){let L=sh(pool().filter(art)),i=0,s=0;if(!L.length){V.innerHTML='<div class="panel">Nu sunt substantive în această categorie.</div>';return}
 const show=()=>{if(i>=L.length){V.innerHTML=`<div class="panel"><h2>Rezultat: ${s} / ${L.length}</h2><button class="btn" onclick="go()">Din nou</button></div>`;return}
 const w=L[i];V.innerHTML=`<div class="panel"><div class="sc">Ce articol are? · Scor ${s}</div><div class="q">___ ${w.g.replace(/^(der|die|das) /,"")}</div><div class="sc">${w.r}</div><div class="row"><button class="btn" data-a="der">der</button><button class="btn" data-a="die">die</button><button class="btn" data-a="das">das</button></div><div class="fb" id="fb"></div></div>`;
 V.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const ok=b.dataset.a==art(w);if(ok)s++;$("fb").style.color=ok?"var(--ok)":"var(--bad)";$("fb").textContent=ok?"✓ Corect!":"✗ Corect este: "+w.g;V.querySelectorAll("[data-a]").forEach(x=>x.disabled=true);setTimeout(()=>{i++;show()},1000)})};show()}
/* Listă */
function list(){V.innerHTML=`<input id="q" placeholder="🔍 Caută…" style="width:100%;margin-bottom:10px"><div class="w"><table id="t"></table></div>`;
 const r=()=>{const q=$("q").value.toLowerCase();$("t").innerHTML=pool().filter(w=>(w.g+w.r).toLowerCase().includes(q)).map(w=>`<tr><td>${known.has(w.id)?"✅":""}</td><td>${w.g}</td><td>${w.r}</td><td><button class="sp" data-s="${w.g}">🔊</button></td></tr>`).join("")};
 r();$("q").oninput=r;$("t").onclick=e=>{if(e.target.dataset.s)say(e.target.dataset.s)}}
go();
</script></body></html>
